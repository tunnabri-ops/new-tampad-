name: Auto Update Playlist

on:
  schedule:
    # প্রতি 2 মিনিট পর পর নিজে নিজে আপডেট হবে
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest M3U playlist
        run: |
          curl -sL "https://raw.githubusercontent.com/srhady/tapmad-bd/main/tapmad_bd.m3u" -o tapmad_bd.m3u

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tapmad_bd.m3u
          git diff-index --quiet HEAD || (git commit -m "Auto update playlist" && git push)
