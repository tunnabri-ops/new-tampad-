name: Auto Update Playlist

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest M3U and JSON (No Cache)
        run: |
          # ক্যাশ বাইপাস করতে টাইমস্ট্যাম্প প্যারামিটার যুক্ত
          TIMESTAMP=$(date +%s)
          curl -H "Cache-Control: no-cache" -sL "https://raw.githubusercontent.com/srhady/tapmad-bd/main/tapmad_bd.m3u?t=${TIMESTAMP}" -o tapmad_bd.m3u
          curl -H "Cache-Control: no-cache" -sL "https://raw.githubusercontent.com/srhady/tapmad-bd/main/tapmad_bd.json?t=${TIMESTAMP}" -o tapmad_bd.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tapmad_bd.m3u tapmad_bd.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update tapmad: $(date)" && git push origin main)
